<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login para Karen 💌</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      text-align: center;
      font-size: xx-large;
    }
    input {
      padding: 10px;
      margin: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      width: 80%;
      font-size: x-large;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background-color: #ff5e78;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: x-large;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Holaa Pamelay👸🏾💖🙉😘 </h2>
    <input type="text" id="usuario" placeholder="Tu nombre?😑">
    <input type="password" id="contrasena" placeholder="Nuestra fecha especial?🤔">
    <button onclick="iniciar()">Entrar</button>
  </div>

  <script src="login.js"></script>
</body>
</html>
